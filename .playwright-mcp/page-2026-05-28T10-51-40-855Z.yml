            - heading [level=3]: 理解偏差 听不懂
            - paragraph: 语言表达有偏差，默认智会难讲明
            - paragraph: 自然语言天然存在歧义性，难以精确传达澄清。在缺乏结构化引导和人类默会知识时，模型对上下文语境的解读容易产生偏差。
            - generic:
              - generic: 操作成本↑
          - generic:
            - generic:
              - generic:
                - img
              - generic: 处理端
            - heading [level=3]: 信息遗漏 记不住
            - paragraph: 长上下文记不住，复杂计算易出错
            - paragraph: 随对话轮次增加与上下文累积，模型有效注意力被分散，导致关键信息遗漏，执行错误。需确定性程序代替执行，减少流程与计算工作。
            - generic:
              - generic: 开发成本↑
          - generic:
            - generic:
              - generic:
                - img
              - generic: 输出端
            - heading [level=3]: 结果失控、靠不准
            - paragraph: 模型幻觉易编撰，结果偏差不自知
            - paragraph: 大语言模型基于概率分布生成内容，本质上输出的是"最可能"，而不是清楚的"知道"；在知识边界之外，模型会生成看似合理但缺乏事实依据的内容。
            - generic:
              - generic: 确认成本↑
